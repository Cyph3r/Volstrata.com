# Copyright 2026 Volstrata.com - https://volstrata.com
#
# gitleaks configuration for the VolStrata API examples.
#
# Run by .github/workflows/verify.yml on every push and pull request, over the
# working tree, blocking. Run it yourself before opening a pull request:
#
#     gitleaks dir . --config .gitleaks.toml --redact --verbose
#
# Two jobs:
#
#   1. Catch a real credential. This repository teaches an API whose keys have a
#      recognisable shape, so the shape gets its own rules below - the default
#      rule set does not know about them.
#
#   2. Stay quiet about the placeholders. Every example here is written to be
#      copied, so `YOUR_API_KEY` and `gex_key_v1_XXXXXXXX` appear on purpose, in
#      docs, in shell snippets and in the MCP client configs. A scan that goes
#      red on those is a scan nobody reads.
#
# No real credential appears in this file. The key formats below are regular
# expressions describing a shape, nothing more.
#
# Written against the gitleaks version pinned in .github/workflows/verify.yml.
# The plural `[[allowlists]]` form used here needs gitleaks 8.25 or newer.
#
# Docs: https://volstrata.com/docs/api-keys

title = "VolStrata API examples"

[extend]
# Keep every default rule, then add the ones below.
useDefault = true

# ---------------------------------------------------------------------------
# Rules - the credential shapes this API issues
# ---------------------------------------------------------------------------

[[rules]]
id = "volstrata-api-key"
description = "VolStrata API key (43 url-safe base64 characters after the prefix)"
# `gex_key_v1_` is the current prefix. `sig_key_v1_` is the legacy prefix, still
# accepted by the API forever, so a leaked one is just as live.
#
# No word boundary in front of the prefix on purpose: a key pasted into the
# middle of a longer token is still a leaked key, and the prefix plus 43
# url-safe characters is specific enough that nothing else in a repository of
# examples looks like it.
regex = '''(?:gex|sig)_key_v1_[A-Za-z0-9_-]{43}'''
keywords = [
  "gex_key_v1_",
  "sig_key_v1_",
]
tags = ["volstrata", "api-key"]

[[rules]]
id = "volstrata-personal-access-token"
description = "VolStrata personal access token"
regex = '''sig_pat_v1_[A-Za-z0-9_-]{20,}'''
keywords = ["sig_pat_v1_"]
tags = ["volstrata", "token"]

[[rules]]
id = "volstrata-service-account-key"
description = "VolStrata service account credential"
regex = '''sig_svc_v1_[A-Za-z0-9_-]{20,}'''
keywords = ["sig_svc_v1_"]
tags = ["volstrata", "token"]

# ---------------------------------------------------------------------------
# Allowlists
# ---------------------------------------------------------------------------

# The placeholders this repository uses everywhere, by name. They are matched
# against the whole line, which is the same scope as gitleaks' own inline
# `gitleaks:allow` escape hatch.
#
# Deliberately narrow: only these exact tokens are excused. A key of the real
# shape is a hit no matter what surrounds it - unless you park it on a line that
# also contains one of these placeholders, which is why the reviewer checklist
# in .github/PULL_REQUEST_TEMPLATE.md asks a human to look too.
[[allowlists]]
description = "Intentional non-secret placeholders used across the examples"
regexTarget = "line"
regexes = [
  # `Authorization: Bearer YOUR_API_KEY` in the MCP client configs, the curl
  # snippets and the docs.
  '''YOUR_API_KEY''',
  # The obviously-fake key shape used when a prefix has to be shown, e.g. in
  # .env.example. Real keys carry 43 characters after the prefix; this carries
  # a run of X.
  '''(?:gex|sig)_key_v1_X+''',
]

# docs/reference/ is regenerated by scripts/sync_catalog.py from public,
# unauthenticated endpoints and committed verbatim. A credential cannot enter
# it, but its policy keys and fingerprints are exactly the kind of long
# identifier the catch-all `generic-api-key` rule flags.
#
# Scoped to that one rule with `targetRules`, so the VolStrata key rules above
# still apply to these files at full strength.
[[allowlists]]
description = "Generated reference - public API output, not authored content"
targetRules = ["generic-api-key"]
paths = ['''(^|/)docs/reference/''']

# Directories that are never committed and are not this repository's content.
[[allowlists]]
description = "Version control metadata and installed dependencies"
paths = [
  '''(^|/)\.git/''',
  '''(^|/)node_modules/''',
  '''(^|/)\.venv/''',
  '''(^|/)__pycache__/''',
]
