# Copyright 2026 Volstrata.com - https://volstrata.com
#
# Weekly resync of the generated API reference.
#
# Everything under docs/reference/ is generated by scripts/sync_catalog.py from
# public, unauthenticated endpoints on https://volstrata.com. When the API
# publishes a new capability, this job notices within a week and opens a pull
# request with the regenerated files. It never pushes to the default branch: a
# human reviews and merges, every time.
#
# Reruns reuse one fixed branch, so a second run updates the open pull request
# instead of opening another one. When nothing has changed, no branch is
# touched and no pull request is opened.
#
# Two repository settings this depends on:
#   * Settings > Actions > General > "Allow GitHub Actions to create and
#     approve pull requests" must be enabled, or the last step cannot open one.
#   * A pull request opened with the built-in GITHUB_TOKEN does not itself
#     trigger `verify.yml`. Close and reopen the pull request, or push an empty
#     commit to it, if you want the full verification run before merging.
#
# Docs: https://volstrata.com/docs/api-overview

name: catalog-sync

on:
  schedule:
    # Mondays, 06:23 UTC. Off the hour on purpose - scheduled runs bunched at
    # :00 are the ones that get delayed.
    - cron: "23 6 * * 1"
  workflow_dispatch:

# The only workflow in this repository that may write. It writes a branch and a
# pull request, and nothing else.
permissions:
  contents: write
  pull-requests: write

# Never two syncs racing for the same branch. This one queues rather than
# cancelling, so a manual run started next to the weekly one still finishes.
concurrency:
  group: catalog-sync
  cancel-in-progress: false

jobs:
  sync:
    name: Regenerate and open a pull request
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install script dependencies, if the scripts declare any
        run: |
          set -eu
          if [ -f scripts/requirements.txt ]; then
            python -m pip install --disable-pip-version-check --requirement scripts/requirements.txt
          else
            echo "scripts/ is standard library only - nothing to install"
          fi

      # `<hash> <path>`, one line per file, path written by us rather than by
      # sha256sum - its own output prefixes the path with `*` in binary mode,
      # which would break the comparison below on a non-Linux runner.
      - name: Record the reference as committed
        run: |
          set -eu
          find docs/reference -type f | sort | while read -r path; do
            printf '%s %s\n' "$(sha256sum "$path" | cut -d ' ' -f 1)" "$path"
          done > "$RUNNER_TEMP/before.txt"
          cat "$RUNNER_TEMP/before.txt"

      # Fetches https://api.volstrata.com/api/openapi.json, the public capability
      # catalog and the anonymous MCP tool list, and rewrites docs/reference/.
      # No credential is used; nothing else in the tree is touched.
      - name: Regenerate docs/reference
        run: python scripts/sync_catalog.py

      - name: Summarise what changed
        id: summary
        run: |
          set -eu
          find docs/reference -type f | sort | while read -r path; do
            printf '%s %s\n' "$(sha256sum "$path" | cut -d ' ' -f 1)" "$path"
          done > "$RUNNER_TEMP/after.txt"

          if cmp -s "$RUNNER_TEMP/before.txt" "$RUNNER_TEMP/after.txt"; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "The generated reference already matches the live API. Nothing to open."
            exit 0
          fi

          changed=$(
            for path in $(find docs/reference -type f | sort); do
              new=$(sha256sum "$path" | cut -d ' ' -f 1)
              old=$(awk -v p="$path" '$2 == p { print $1 }' "$RUNNER_TEMP/before.txt")
              if [ -z "$old" ]; then
                printf -- '- `%s` (new)\n' "$path"
              elif [ "$old" != "$new" ]; then
                printf -- '- `%s`\n' "$path"
              fi
            done
            while read -r _sum path; do
              if [ ! -f "$path" ]; then
                printf -- '- `%s` (removed)\n' "$path"
              fi
            done < "$RUNNER_TEMP/before.txt"
          )

          echo "Changed:"
          echo "$changed"

          {
            echo "changed=true"
            echo "body<<VOLSTRATA_PR_BODY"
            echo "The generated API reference has drifted from the live public API."
            echo ""
            echo "### Files changed by this run"
            echo ""
            echo "$changed"
            echo ""
            echo "### Where this comes from"
            echo ""
            echo "Everything under \`docs/reference/\` is generated by \`scripts/sync_catalog.py\`"
            echo "from public, unauthenticated endpoints on <https://volstrata.com>:"
            echo "\`GET /api/openapi.json\`, \`GET /api/v1/meta/capabilities\` and an anonymous"
            echo "\`tools/list\` against \`POST /api/v1/mcp\`. No API key is involved, and none of"
            echo "these files is hand-edited."
            echo ""
            echo "### Reviewing this"
            echo ""
            echo "Read the diff as an API changelog: new or removed operations, changed plan"
            echo "floors, changed parameters. Regenerate locally with \`python scripts/sync_catalog.py\`"
            echo "if you want to confirm it, then merge. Do not hand-edit the files on this branch -"
            echo "the next run would revert the edit."
            echo ""
            echo "Opened automatically by \`.github/workflows/drift-check.yml\`."
            echo "VOLSTRATA_PR_BODY"
          } >> "$GITHUB_OUTPUT"

      - name: Open or update the sync pull request
        if: steps.summary.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676 # v7.0.11
        with:
          base: main
          # Fixed on purpose: rerunning updates this one branch and the one
          # pull request open against it.
          branch: chore/catalog-sync
          delete-branch: true
          commit-message: "chore: sync generated API reference"
          title: "chore: sync generated API reference"
          body: ${{ steps.summary.outputs.body }}
          # Only the generated files may be committed by this job.
          add-paths: docs/reference
          labels: automated
